[package]
name = "winport_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
jni = "0.21"
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
libloading = "0.8"
chd = { version = "0.3.4", default-features = false, features = ["std", "cd_full"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
